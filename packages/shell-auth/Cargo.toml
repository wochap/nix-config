[package]
name = "shell-auth"
version = "0.1.0"
edition = "2021"
description = "Bridges pinentry, ssh askpass and the gnome-keyring system prompter to the quickshell auth dialog"
license = "MIT"

[[bin]]
name = "shell-auth"
path = "src/main.rs"

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
futures-util = "0.3"
getrandom = "0.2"
hkdf = "0.12"
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zeroize = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
