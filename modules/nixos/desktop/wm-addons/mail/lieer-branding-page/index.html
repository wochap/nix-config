<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>@appName@</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 40rem;
        margin: 4rem auto;
        padding: 0 1.25rem;
        line-height: 1.6;
      }
      a { color: inherit; }
      footer { margin-top: 2.5rem; font-size: 0.9rem; opacity: 0.8; }
    </style>
  </head>
  <body>
    <main>
      <h1>@appName@</h1>
      <p>
        Personal, self-hosted OAuth client for synchronizing Gmail with
        <a href="https://github.com/gauteh/lieer" rel="noopener noreferrer">Lieer</a>
        and <a href="https://notmuchmail.org/" rel="noopener noreferrer">Notmuch</a>.
      </p>
      <p>
        This application is operated strictly for private, single-owner email
        synchronization and is not offered as a public service.
      </p>
      <p>
        Contact: <a href="mailto:@contactEmail@">@contactEmail@</a>
      </p>
    </main>
    <footer>
      <a href="/privacy">Privacy Policy</a>
    </footer>
  </body>
</html>
