<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5/700.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>body{margin:0;font-family:'Iosevka Nerd Font','Iosevka','JetBrains Mono',monospace;color:#cdd6f4;-webkit-font-smoothing:antialiased}.material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'opsz' 20;user-select:none}@keyframes recpulse{0%,100%{opacity:1}50%{opacity:.3}}</style>
</helmet>
<div style="{{ outer }}">
<div style="{{ rail }}">
  <div style="{{ zone }}">
    <sc-if value="{{ busy }}" hint-placeholder-val="{{ true }}">
      <div title="Monocle · 3 windows" style="width:32px;height:22px;display:flex;align-items:center;justify-content:center;color:#cba6f7;font-size:12px;font-weight:500">[3]</div>
      <div style="width:20px;padding:8px 0;border-radius:10px;background:#cba6f7;color:#11111b;font-size:10px;font-weight:700;letter-spacing:.12em;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center">RESIZE</div>
    </sc-if>
    <div title="Focused: nvim" style="width:32px;height:32px;border-radius:16px;background:#313244;box-shadow:inset 0 0 0 1px #45475a;display:flex;align-items:center;justify-content:center;color:#89b4fa"><span class="material-symbols-rounded" style="font-size:17px">terminal</span></div>
    <div title="Harpoon · 3 pinned" style="display:flex;flex-direction:column;align-items:center;color:#bac2de"><span class="material-symbols-rounded" style="font-size:16px;color:#9399b2">push_pin</span><span style="font-size:10px;line-height:11px">3</span></div>
  </div>

  <div style="{{ zoneMid }}">
    <sc-for list="{{ ws }}" as="w" hint-placeholder-count="10">
      <div style="width:28px;height:{{ w.h }}px;border-radius:14px;background:{{ w.bg }};color:{{ w.fg }};box-shadow:{{ w.ring }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:{{ w.fw }};line-height:12px">
        <span>{{ w.n }}</span>
        <div style="display:flex;gap:2px;height:3px"><sc-for list="{{ w.dots }}" as="d"><span style="width:3px;height:3px;border-radius:2px;background:{{ w.dotc }}"></span></sc-for></div>
      </div>
    </sc-for>
  </div>

  <div style="{{ zone }}">
    <sc-if value="{{ busy }}" hint-placeholder-val="{{ true }}">
      <span title="Caps Lock" style="width:28px;height:22px;border-radius:11px;background:rgba(249,226,175,.14);color:#f9e2af;display:flex;align-items:center;justify-content:center"><span class="material-symbols-rounded" style="font-size:15px">keyboard_capslock</span></span>
      <span title="Idle inhibited" class="material-symbols-rounded" style="font-size:16px;color:#fab387;font-variation-settings:'FILL' 1">coffee</span>
      <div style="display:flex;flex-direction:column;align-items:center;color:#cba6f7"><span class="material-symbols-rounded" style="font-size:16px">smart_toy</span><span style="font-size:10px;line-height:11px">2</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;color:#a6e3a1"><span class="material-symbols-rounded" style="font-size:16px">timer</span><span style="font-size:10px;line-height:11px">1:24</span></div>
    </sc-if>
    <div style="display:flex;flex-direction:column;align-items:center;color:#89b4fa"><span class="material-symbols-rounded" style="font-size:16px">mail</span><span style="font-size:10px;line-height:11px;color:#cdd6f4">13</span></div>
    <sc-if value="{{ busy }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;align-items:center;color:#f9e2af"><span class="material-symbols-rounded" style="font-size:16px">outbox</span><span style="font-size:10px;line-height:11px">2</span></div>
      <div style="width:32px;padding:4px 0;border-radius:11px;background:rgba(243,139,168,.16);display:flex;flex-direction:column;align-items:center;gap:2px;color:#f38ba8;font-size:10px;line-height:11px"><span style="width:7px;height:7px;border-radius:4px;background:#f38ba8;animation:recpulse 1.6s ease-in-out infinite"></span>3:12</div>
      <span title="WireGuard wg0" class="material-symbols-rounded" style="font-size:16px;color:#a6e3a1">vpn_lock</span>
    </sc-if>
    <div style="position:relative">
      <span style="width:28px;height:22px;border-radius:11px;background:{{ trayBg }};color:#a6adc8;display:flex;align-items:center;justify-content:center;box-shadow:{{ trayRing }}"><span class="material-symbols-rounded" style="font-size:16px">more_horiz</span></span>
      <sc-if value="{{ trayOpen }}">
        <div style="position:absolute;left:44px;top:-40px;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:8px;background:#1e1e2e;box-shadow:inset 0 0 0 1px #313244, 0 10px 28px rgba(17,17,27,.55);z-index:2">
          <span style="font-size:10px;color:#7f849c;letter-spacing:.06em;padding-left:2px">TRAY · 6</span>
          <div style="display:grid;grid-template-columns:repeat(3,28px);gap:4px">
            <span style="width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#cdd6f4;background:#313244"><span class="material-symbols-rounded" style="font-size:16px;font-variation-settings:'FILL' 1">shield_lock</span></span>
            <span style="width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#a6adc8"><span class="material-symbols-rounded" style="font-size:16px">cloud_sync</span></span>
            <span style="width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#a6adc8"><span class="material-symbols-rounded" style="font-size:16px">forum</span></span>
            <span style="width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#a6adc8"><span class="material-symbols-rounded" style="font-size:16px">deployed_code</span></span>
            <span style="width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#a6adc8"><span class="material-symbols-rounded" style="font-size:16px">key</span></span>
            <span style="width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#a6adc8"><span class="material-symbols-rounded" style="font-size:16px">sync_saved_locally</span></span>
          </div>
        </div>
      </sc-if>
    </div>
    <div style="{{ cluster }}">
      <span class="material-symbols-rounded" style="font-size:16px;color:#cdd6f4">wifi</span>
      <span class="material-symbols-rounded" style="font-size:16px;color:#cdd6f4">volume_up</span>
      <div style="display:flex;flex-direction:column;align-items:center"><span class="material-symbols-rounded" style="font-size:16px;color:#a6e3a1">battery_charging_80</span><span style="font-size:10px;line-height:11px;color:#cdd6f4">82</span></div>
    </div>
    <div title="Calendar" style="{{ clockBox }}">
      <div style="display:flex;flex-direction:column;align-items:center;width:28px">
        <span style="font-size:16px;line-height:17px;font-weight:500;color:#cdd6f4">21</span>
        <span style="font-size:16px;line-height:17px;font-weight:500;color:#cdd6f4">07</span>
        <span style="font-size:10px;line-height:12px;color:#7f849c;margin-top:2px">01·10</span>
      </div>
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:1080},&quot;h&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1080,&quot;tsType&quot;:&quot;number&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;busy&quot;,&quot;minimal&quot;],&quot;default&quot;:&quot;busy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;trayOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;ccOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;calOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const H = Number(p.h ?? 1080), isl = (p.direction ?? 'flat') === 'islands', busy = (p.variant ?? 'busy') === 'busy';
    const trayOpen = !!p.trayOpen, ccOpen = !!p.ccOpen;
    const pad = isl ? 6 : 0;
    const outer = { width: 44 + pad * 2, height: H, padding: pad, boxSizing: 'border-box', position: 'relative' };
    const rail = { width: 44, height: H - pad * 2, boxSizing: 'border-box', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', alignItems: 'center',
      padding: isl ? 0 : '6px 0', background: isl ? 'transparent' : '#181825', boxShadow: isl ? 'none' : 'inset -1px 0 0 #313244' };
    const box = isl ? { background: '#1e1e2e', borderRadius: 8, padding: '6px 0', boxShadow: 'inset 0 0 0 1px #313244, 0 4px 14px rgba(17,17,27,.5)' } : {};
    const zone = { width: 44, boxSizing: 'border-box', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8, ...box };
    const zoneMid = { ...zone, gap: 3 };
    const occ = busy ? { 1: 2, 2: 1, 3: 3, 4: 1, 5: 2, 6: 1, 7: 1, 8: 1 } : { 1: 1, 2: 2, 3: 1 };
    const focus = busy ? 4 : 2, urgent = busy ? [7] : [];
    let ws = Array.from({ length: 10 }, (_, i) => {
      const n = i + 1, c = occ[n] || 0, f = n === focus, u = urgent.includes(n);
      return { n, c, h: f ? 34 : 24, bg: f ? '#cba6f7' : u ? 'rgba(243,139,168,.16)' : 'transparent', fg: f ? '#11111b' : u ? '#f38ba8' : c ? '#cdd6f4' : '#585b70',
        fw: f ? 700 : 500, ring: u ? 'inset 0 0 0 1px rgba(243,139,168,.55)' : 'none', dots: Array(Math.min(c, 3)).fill(0), dotc: f ? '#11111b' : u ? '#f38ba8' : '#7f849c' };
    });
    if (!busy) ws = ws.filter(w => w.c || w.n === focus);
    const cluster = { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, width: 36, padding: '6px 0', borderRadius: 18,
      background: ccOpen ? '#313244' : 'transparent', boxShadow: ccOpen ? 'inset 0 0 0 1px rgba(203,166,247,.55)' : 'none' };
    const calOpen = !!p.calOpen;
    const clockBox = { display: 'flex', flexDirection: 'column', alignItems: 'center', width: 36, padding: '6px 0', borderRadius: 18,
      background: calOpen ? '#313244' : 'transparent', boxShadow: calOpen ? 'inset 0 0 0 1px rgba(203,166,247,.55)' : 'none' };
    return { outer, rail, zone, zoneMid, ws, busy, trayOpen, cluster, clockBox,
      trayBg: trayOpen ? '#313244' : 'transparent', trayRing: trayOpen ? 'inset 0 0 0 1px rgba(203,166,247,.55)' : 'none' };
  }
}
</script>
</body>
</html>
