<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5/500.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>:root{--bg:#1e1e2e;--mantle:#181825;--crust:#11111b;--s0:#313244;--s1:#45475a;--s2:#585b70;--field-br:#6c7086;--ov:#9399b2;--text:#cdd6f4;--sub:#a6adc8;--accent:#cba6f7;--ink:#cba6f7;--ink-h:#d9bdfa;--ink-p:#b48ef0;--on-ink:#11111b;--red:#f38ba8;--peach:#fab387;--yellow:#f9e2af;--green:#a6e3a1;--sky:#89dceb;--blue:#89b4fa;--shadow:0 16px 40px rgba(17,17,27,.6),0 2px 8px rgba(17,17,27,.4)}html,body{background:#11111b}body{margin:0;font-family:'Iosevka Nerd Font','Iosevka',monospace;color:#cdd6f4;-webkit-font-smoothing:antialiased}a{color:#cba6f7}a:hover{color:#d9bdfa}.material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'opsz' 20;user-select:none}</style>
</helmet>
<div style="{{ root }}">
  <sc-if value="{{ sheet }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:4px;max-width:880px">
      <span style="font-size:10px;letter-spacing:.12em;color:var(--accent)">COMPONENT · LockClock</span>
      <span style="font-size:22px;font-weight:500">Clock &amp; date</span>
      <span style="font-size:12px;line-height:18px;color:var(--sub)">Every output. Primary: above LockInput. Secondary: alone, with the on-activity hint.</span>
    </div>
  </sc-if>
  <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">
    <sc-for list="{{ cells }}" as="c" hint-placeholder-count="1">
      <div style="{{ c.cell }}">
        <sc-if value="{{ c.bg }}"><img src="assets/wallpaper.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.55) brightness(.7)"><div style="position:absolute;inset:0;background:var(--crust);opacity:.5"></div></sc-if>
        <sc-if value="{{ c.label }}"><div style="position:relative;align-self:stretch;display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;font-weight:500;color:var(--text)">{{ c.label }}</span><span style="font-size:10px;line-height:14px;color:var(--sub)">{{ c.note }}</span></div></sc-if>
        <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:{{ c.op }};transition:opacity 150ms cubic-bezier(.33,1,.68,1)">
          <div style="font-size:112px;line-height:112px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--text)">{{ c.time }}</div>
          <div style="font-size:22px;line-height:28px;color:var(--sub)">{{ c.date }}</div>
          <sc-if value="{{ c.hint }}"><div style="margin-top:20px;display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--sub)"><span class="material-symbols-rounded" style="font-size:16px">{{ c.hintIcon }}</span><span>Unlock on the other screen</span></div></sc-if>
        </div>
      </div>
    </sc-for>
  </div>
  <sc-if value="{{ sheet }}" hint-placeholder-val="{{ false }}">
    <div style="display:grid;grid-template-columns:200px minmax(0,1fr);max-width:960px;border-top:1px solid var(--s0)">
      <sc-for list="{{ specs }}" as="r" hint-placeholder-count="6"><div style="padding:6px 12px 6px 0;border-bottom:1px solid var(--s0);font-size:12px;line-height:18px;color:var(--sub)">{{ r.k }}</div><div style="padding:6px 0;border-bottom:1px solid var(--s0);font-size:12px;line-height:18px;color:var(--text);text-wrap:pretty">{{ r.v }}</div></sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:1100},&quot;sheet&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dim&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;hint&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;13:52&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;date&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tuesday, 6 October 2026&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, sheet = p.sheet ?? true, F = "'Iosevka Nerd Font','Iosevka',monospace";
    const m = (dim, hint, icon) => ({ op: dim ? 0.4 : 1, hint: !!hint, hintIcon: icon || 'arrow_back', time: p.time ?? '13:52', date: p.date ?? 'Tuesday, 6 October 2026' });
    if (!sheet) return { sheet, root: { display: 'flex', fontFamily: F, color: 'var(--text)' }, cells: [{ ...m(p.dim, p.hint, p.hintIcon), cell: { display: 'contents' }, bg: false, label: '' }], specs: [] };
    const cell = { position: 'relative', overflow: 'hidden', borderRadius: 8, boxShadow: 'inset 0 0 0 1px var(--s0)', padding: 24, boxSizing: 'border-box', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 20, width: 560, minHeight: 280 };
    const cells = [
      ['Primary · default', 'Above LockInput, 40px gap'], ['Idle-dimmed', 'opacity .4 after 30s without input'],
      ['Secondary · at rest', 'Proposal: nothing but clock + date'], ['Secondary · on activity', 'Pointer enters / key pressed here · auto-hides 4s']
    ].map(([label, note], i) => ({ ...m(i === 1, i === 3), cell, bg: true, label, note }));
    const specs = [
      ['Clock', 'Iosevka 500 · 112/112 · tracking −2% · tabular figures · --text · HH:mm (24h, locale), no seconds'],
      ['Date', 'Iosevka 400 · 22/28 · --sub · "dddd, d MMMM yyyy" · 4px below the clock'],
      ['Update', 'Single timer re-armed on each minute boundary (no 1s polling); reuse the bar\'s Time singleton'],
      ['Position · primary', 'Column centred horizontally; clock top at 332px on 1080p; LockInput 40px below date. Rows below the field grow downward only — the clock never moves'],
      ['Position · secondary', 'Same block, vertically centred. Same px sizes on every output (1x)'],
      ['Idle-dimmed', 'opacity 1 → .4 · 150ms OutCubic; any key / pointer motion → 1 · 150ms OutCubic'],
      ['Secondary hint', 'Hidden at rest. On activity on that output: row 12/16 --sub, glyph 16 pointing toward the focused output (arrow_back / arrow_forward / arrow_upward / arrow_downward from output geometry), 20px below the date. Enter 150ms OutCubic + 8px rise; exit after 4s, 120ms InCubic'],
      ['QML', 'Text { font.family: Theme.fontMono; font.pixelSize: 112; font.weight: Font.Medium; font.features: { "tnum": 1 } }']
    ].map(([k, v]) => ({ k, v }));
    return { sheet, root: { display: 'flex', flexDirection: 'column', gap: 24, padding: 32, fontFamily: F, color: 'var(--text)', background: 'var(--crust)' }, cells, specs };
  }
}
</script>
</body>
</html>
