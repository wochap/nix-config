<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5/700.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>body{margin:0;font-family:'Iosevka Nerd Font','Iosevka','JetBrains Mono',monospace;color:#cdd6f4;-webkit-font-smoothing:antialiased}.material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'opsz' 20;user-select:none}</style>
</helmet>
<div style="{{ card }}">
  <div style="display:flex;align-items:center;gap:6px;height:18px">
    <span class="material-symbols-rounded" style="font-size:15px;color:{{ n.iconColor }};font-variation-settings:'FILL' 1">{{ n.icon }}</span>
    <span style="font-size:10px;color:#a6adc8;letter-spacing:.02em">{{ n.app }}</span>
    <span style="font-size:10px;color:#6c7086">· {{ n.time }}</span>
    <sc-if value="{{ critical }}"><span style="font-size:10px;font-weight:700;letter-spacing:.06em;color:#f38ba8;padding:0 6px;height:16px;line-height:16px;border-radius:8px;background:rgba(243,139,168,.14)">CRITICAL</span></sc-if>
    <span style="flex:1"></span>
    <span style="{{ btnA }}"><span class="material-symbols-rounded" style="font-size:15px">{{ expandIcon }}</span></span>
    <span style="{{ btnB }}"><span class="material-symbols-rounded" style="font-size:15px">close</span></span>
  </div>
  <div style="display:flex;gap:10px;align-items:flex-start">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
      <div style="font-size:14px;line-height:18px;font-weight:500;color:{{ summaryColor }};text-wrap:pretty">{{ n.summary }}</div>
      <sc-if value="{{ n.meta }}"><div style="font-size:10px;line-height:14px;color:#7f849c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ n.meta }}</div></sc-if>
      <div style="{{ bodyStyle }}">{{ n.body }}</div>
      <sc-if value="{{ n.foot }}"><div style="font-size:10px;line-height:14px;color:#6c7086;margin-top:2px">{{ n.foot }}</div></sc-if>
    </div>
    <sc-if value="{{ n.image }}"><img src="{{ n.image }}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:4px;box-shadow:inset 0 0 0 1px #313244;flex:none"></sc-if>
  </div>
  <sc-if value="{{ hasActions }}">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:2px">
      <sc-for list="{{ actions }}" as="a" hint-placeholder-count="2">
        <span style="{{ a.style }}">{{ a.label }}</span>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ hasProgress }}"><div style="position:absolute;left:0;bottom:0;height:2px;width:{{ pct }};background:{{ barColor }};border-radius:0 2px 2px 0"></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:160},&quot;n&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;toast&quot;,&quot;card&quot;],&quot;default&quot;:&quot;toast&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;hover&quot;,&quot;pressed&quot;,&quot;expanded&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:380,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const n = p.n ?? { app: 'Takeshot', icon: 'screenshot_region', iconColor: '#89b4fa', time: 'now', summary: 'Screenshot saved', body: '~/Pictures/Screenshots/2026-10-01_21-07-12.png · 2560×1440', image: 'assets/win2.png', actions: ['Open', 'Edit', 'Copy PNG'], urgency: 'normal', progress: 0.62 };
    const toast = (p.mode ?? 'toast') === 'toast';
    const st = p.state ?? 'default';
    const u = n.urgency ?? 'normal', critical = u === 'critical', low = u === 'low';
    const W = Number(p.w ?? 380);
    const border = critical ? 'rgba(243,139,168,.6)' : st === 'hover' || st === 'pressed' ? '#45475a' : '#313244';
    const card = { width: W, boxSizing: 'border-box', position: 'relative', overflow: 'hidden', borderRadius: 8, padding: '9px 10px 10px 12px',
      display: 'flex', flexDirection: 'column', gap: 6,
      background: st === 'pressed' ? '#313244' : st === 'hover' ? '#28283a' : critical ? '#251e2c' : '#1e1e2e',
      boxShadow: [`inset 0 0 0 1px ${border}`, toast ? '0 10px 28px rgba(17,17,27,.55), 0 2px 6px rgba(17,17,27,.4)' : null].filter(Boolean).join(', '),
      opacity: low ? 0.92 : 1 };
    const btn = (on) => ({ width: 22, height: 22, borderRadius: 11, display: 'flex', alignItems: 'center', justifyContent: 'center',
      color: on ? '#cdd6f4' : '#7f849c', background: on ? '#45475a' : 'transparent' });
    const expanded = st === 'expanded';
    const bodyStyle = { fontSize: 12, lineHeight: '16px', color: low ? '#a6adc8' : '#bac2de',
      ...(expanded ? {} : { display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }) };
    const acts = n.actions ?? [];
    const actions = acts.map((label, i) => ({ label, style: { height: 24, padding: '0 10px', borderRadius: 12, display: 'flex', alignItems: 'center', fontSize: 12, fontWeight: 500,
      color: i === 0 ? (critical ? '#f38ba8' : '#cba6f7') : '#cdd6f4',
      background: i === 0 ? 'transparent' : (st === 'hover' && i === 1 ? '#45475a' : '#313244'),
      boxShadow: i === 0 ? `inset 0 0 0 1px ${critical ? 'rgba(243,139,168,.6)' : 'rgba(203,166,247,.6)'}` : 'none' } }));
    const hasProgress = toast && n.progress != null && !critical;
    return { n, card, critical, btnA: btn(false), btnB: btn(st === 'hover'), expandIcon: expanded ? 'unfold_less' : 'unfold_more',
      summaryColor: low ? '#bac2de' : '#cdd6f4', bodyStyle, actions, hasActions: acts.length > 0,
      hasProgress, pct: `${Math.round((n.progress ?? 0) * 100)}%`, barColor: low ? '#7f849c' : '#cba6f7' };
  }
}
</script>
</body>
</html>
