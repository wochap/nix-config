<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5/700.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>body{margin:0;font-family:'Iosevka Nerd Font','Iosevka','JetBrains Mono',monospace;color:#cdd6f4;-webkit-font-smoothing:antialiased}.material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 400,'opsz' 20;user-select:none}@keyframes recpulse{0%,100%{opacity:1}50%{opacity:.3}}</style>
</helmet>
<div style="{{ outer }}">
<div style="{{ rail }}">

<sc-if value="{{ showLeft }}" hint-placeholder-val="{{ true }}">
<div style="{{ zone }}">
  <sc-if value="{{ busy }}" hint-placeholder-val="{{ true }}">
    <div title="Monocle · 3 windows" style="display:flex;align-items:center;height:28px;padding:0 7px;border-radius:14px;background:{{ chipBg }};color:#cba6f7;font-size:12px;font-weight:500">[3]</div>
    <div title="Special workspaces" style="display:flex;align-items:center;gap:6px;height:28px;padding:0 7px;border-radius:14px;background:{{ chipBg }};color:#bac2de;font-size:12px">
      <span style="display:flex;align-items:center;gap:3px"><span class="material-symbols-rounded" style="font-size:14px;color:#9399b2">terminal</span>1</span>
      <span style="display:flex;align-items:center;gap:3px"><span class="material-symbols-rounded" style="font-size:14px;color:#9399b2">music_note</span>1</span>
    </div>
  </sc-if>
  <div title="Harpoon · 3 pinned" style="display:flex;align-items:center;gap:6px;height:28px;padding:0 7px;border-radius:14px;background:{{ chipBg }};color:#bac2de;font-size:12px">
    <span style="display:flex;align-items:center;gap:3px"><span class="material-symbols-rounded" style="font-size:14px;color:#9399b2">push_pin</span>3</span>
  </div>
  <sc-if value="{{ busy }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:10px;background:#cba6f7;color:#11111b;font-size:10px;font-weight:700;letter-spacing:.08em"><span class="material-symbols-rounded" style="font-size:13px">open_with</span>RESIZE</div>
  </sc-if>
  <div style="position:relative;display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 6px;min-width:0;border-radius:8px;background:{{ titleBg }}">
    <span class="material-symbols-rounded" style="font-size:18px;color:#89b4fa">terminal</span>
    <div style="display:flex;flex-direction:column;min-width:0;line-height:11px">
      <span style="font-size:10px;line-height:11px;color:#7f849c;white-space:nowrap">{{ appId }}</span>
      <div style="position:relative;display:flex;min-width:0">
        <span style="font-size:12px;line-height:13px;color:{{ titleFg }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:{{ titleMax }}px;border-radius:2px;box-shadow:{{ titleLine }}">{{ title }}</span>
        <sc-if value="{{ titleTip }}">
          <div style="position:absolute;left:-8px;top:24px;z-index:5;width:max-content;max-width:560px;padding:6px 10px;border-radius:8px;background:#1e1e2e;box-shadow:inset 0 0 0 1px #313244, 0 10px 28px rgba(17,17,27,.55), 0 2px 6px rgba(17,17,27,.4)">
            <span style="font-size:12px;line-height:16px;color:#cdd6f4;text-wrap:pretty;word-break:break-all">{{ title }}</span>
          </div>
        </sc-if>
      </div>
    </div>
  </div>
</div>
</sc-if>

<div style="{{ center }}">
  <sc-for list="{{ ws }}" as="w" hint-placeholder-count="10">
    <div style="width:{{ w.w }}px;height:28px;border-radius:14px;background:{{ w.bg }};color:{{ w.fg }};box-shadow:{{ w.ring }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:{{ w.fw }};line-height:12px">
      <span>{{ w.n }}</span>
      <sc-if value="{{ dots }}" hint-placeholder-val="{{ true }}"><div style="display:flex;gap:2px;height:3px"><sc-for list="{{ w.dots }}" as="d"><span style="width:3px;height:3px;border-radius:2px;background:{{ w.dotc }}"></span></sc-for></div></sc-if>
    </div>
  </sc-for>
</div>

<div style="{{ zoneR }}">
  <sc-if value="{{ showTray }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:14px;background:{{ chipBg }};color:#a6adc8">
      <span class="material-symbols-rounded" style="font-size:16px;font-variation-settings:'FILL' 1">shield_lock</span>
      <span class="material-symbols-rounded" style="font-size:16px">cloud_sync</span>
      <span class="material-symbols-rounded" style="font-size:16px">forum</span>
      <span class="material-symbols-rounded" style="font-size:16px">deployed_code</span>
    </div>
  </sc-if>
  <sc-if value="{{ busy }}" hint-placeholder-val="{{ true }}">
    <div title="Caps Lock" style="display:flex;align-items:center;gap:3px;height:28px;padding:0 7px;border-radius:14px;background:rgba(249,226,175,.14);color:#f9e2af;font-size:10px;font-weight:700;letter-spacing:.06em"><span class="material-symbols-rounded" style="font-size:14px">keyboard_capslock</span>CAPS</div>
    <div title="Idle inhibited" style="display:flex;align-items:center;height:28px;padding:0 6px;border-radius:14px;background:{{ chipBg }};color:#fab387"><span class="material-symbols-rounded" style="font-size:16px;font-variation-settings:'FILL' 1">coffee</span></div>
    <div title="AI agents" style="display:flex;align-items:center;gap:4px;height:28px;padding:0 7px;border-radius:14px;background:{{ chipBg }};color:#cba6f7;font-size:12px"><span class="material-symbols-rounded" style="font-size:16px">smart_toy</span>2</div>
    <div title="Timewarrior" style="display:flex;align-items:center;gap:4px;height:28px;padding:0 7px;border-radius:14px;background:{{ chipBg }};color:#a6e3a1;font-size:12px"><span class="material-symbols-rounded" style="font-size:16px">timer</span><span style="color:#bac2de">shell</span>1:24</div>
  </sc-if>
  <sc-if value="{{ notMinimal }}" hint-placeholder-val="{{ true }}">
    <div title="Unread mail" style="display:flex;align-items:center;gap:4px;height:28px;padding:0 7px;border-radius:14px;background:{{ chipBg }};color:#cdd6f4;font-size:12px"><span class="material-symbols-rounded" style="font-size:16px;color:#89b4fa">mail</span>13</div>
  </sc-if>
  <sc-if value="{{ busy }}" hint-placeholder-val="{{ true }}">
    <div title="Outbox queue" style="display:flex;align-items:center;gap:4px;height:28px;padding:0 7px;border-radius:14px;background:{{ chipBg }};color:#f9e2af;font-size:12px"><span class="material-symbols-rounded" style="font-size:16px">outbox</span>2</div>
    <div title="Recording" style="display:flex;align-items:center;gap:5px;height:28px;padding:0 8px;border-radius:14px;background:rgba(243,139,168,.16);color:#f38ba8;font-size:12px;font-weight:500"><span style="width:7px;height:7px;border-radius:4px;background:#f38ba8;animation:recpulse 1.6s ease-in-out infinite"></span>03:12</div>
  </sc-if>
  <sc-if value="{{ notMinimal }}" hint-placeholder-val="{{ true }}">
    <div title="WireGuard" style="display:flex;align-items:center;gap:4px;height:28px;padding:0 7px;border-radius:14px;background:{{ chipBg }};color:#a6e3a1;font-size:12px"><span class="material-symbols-rounded" style="font-size:16px">vpn_lock</span><span style="color:#bac2de">wg0</span></div>
  </sc-if>
  <div style="{{ cluster }}">
    <sc-if value="{{ notMinimal }}" hint-placeholder-val="{{ true }}">
      <span class="material-symbols-rounded" style="font-size:16px;color:#cdd6f4">wifi</span>
      <span class="material-symbols-rounded" style="font-size:16px;color:#cdd6f4">volume_up</span>
    </sc-if>
    <span style="display:flex;align-items:center;gap:2px;font-size:12px;color:#cdd6f4"><span class="material-symbols-rounded" style="font-size:16px;color:#a6e3a1;transform:rotate(90deg)">battery_charging_80</span>82%</span>
  </div>
  <div title="Calendar" style="{{ clockChip }}"><span style="font-size:12px;color:#cdd6f4;font-weight:500;white-space:nowrap">{{ clock }}</span></div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:40},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;minimal&quot;,&quot;normal&quot;,&quot;busy&quot;],&quot;default&quot;:&quot;busy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1920,&quot;tsType&quot;:&quot;number&quot;},&quot;ccOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;calOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;titleTip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;focus&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;tsType&quot;:&quot;number&quot;},&quot;dots&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const v = p.variant ?? 'normal', d = p.direction ?? 'flat', W = Number(p.w ?? 1920);
    const busy = v === 'busy', minimal = v === 'minimal';
    const flat = d === 'flat', isl = d === 'islands', soft = d === 'soft';
    const ccOpen = !!p.ccOpen;
    const pad = flat ? 0 : isl ? 6 : 8;
    const outer = { width: W, height: 40 + pad * 2, padding: pad, boxSizing: 'border-box', position: 'relative' };
    const rail = { height: 40, position: 'relative', display: 'flex', alignItems: 'center', boxSizing: 'border-box',
      padding: flat ? '0 6px' : soft ? '0 6px' : 0,
      background: flat ? '#181825' : soft ? '#1e1e2e' : 'transparent', borderRadius: soft ? 8 : 0,
      boxShadow: flat ? 'inset 0 -1px 0 #313244' : soft ? 'inset 0 0 0 1px #313244, 0 6px 18px rgba(17,17,27,.45)' : 'none' };
    const islandBox = isl ? { background: '#1e1e2e', borderRadius: 8, padding: '0 5px', boxShadow: 'inset 0 0 0 1px #313244, 0 4px 14px rgba(17,17,27,.5)' } : {};
    const zone = { display: 'flex', alignItems: 'center', gap: soft ? 6 : 4, height: 40, boxSizing: 'border-box', minWidth: 0, ...islandBox };
    const zoneR = { ...zone, marginLeft: 'auto' };
    const center = { ...zone, gap: 2, position: 'absolute', left: '50%', top: 0, transform: 'translateX(-50%)' };
    const chipBg = soft ? '#313244' : 'transparent';
    const occ = busy ? { 1: 2, 2: 1, 3: 3, 4: 1, 5: 2, 6: 1, 7: 1, 8: 1 } : minimal ? { 1: 1, 2: 2, 3: 1 } : { 1: 1, 2: 1, 3: 2, 4: 1, 5: 1, 6: 1, 7: 1, 8: 1 };
    const focus = Number(p.focus ?? (minimal ? 2 : 4));
    const urgent = busy ? [7] : [];
    let ws = Array.from({ length: 10 }, (_, i) => {
      const n = i + 1, c = occ[n] || 0, f = n === focus, u = urgent.includes(n);
      return { n, c, w: f ? 36 : 26, bg: f ? '#cba6f7' : u ? 'rgba(243,139,168,.16)' : 'transparent',
        fg: f ? '#11111b' : u ? '#f38ba8' : c ? '#cdd6f4' : '#585b70', fw: f ? 700 : 500,
        ring: u ? 'inset 0 0 0 1px rgba(243,139,168,.55)' : 'none',
        dots: Array(Math.min(c, 3)).fill(0), dotc: f ? '#11111b' : u ? '#f38ba8' : '#7f849c' };
    });
    if (minimal) ws = ws.filter(w => w.c || w.n === focus);
    const cluster = { display: 'flex', alignItems: 'center', gap: 8, height: 32, padding: '0 10px', borderRadius: 16, marginLeft: 2,
      background: ccOpen ? '#313244' : chipBg, boxShadow: ccOpen ? 'inset 0 0 0 1px rgba(203,166,247,.55)' : 'none' };
    const calOpen = !!p.calOpen;
    const clockChip = { display: 'flex', alignItems: 'center', height: 32, padding: '0 10px', borderRadius: 16,
      background: calOpen ? '#313244' : chipBg, boxShadow: calOpen ? 'inset 0 0 0 1px rgba(203,166,247,.55)' : 'none' };
    const titleTip = !!p.titleTip;
    return { titleTip, titleBg: 'transparent', titleFg: titleTip ? '#cdd6f4' : '#bac2de', titleLine: 'none', outer, rail, zone, zoneR, center, chipBg, ws, cluster, clockChip, busy, notMinimal: !minimal, showLeft: !minimal,
      showTray: !minimal, dots: p.dots ?? true,
      appId: p.appId ?? (busy ? 'kitty' : 'firefox'),
      title: p.title ?? (busy ? 'nvim · ~/src/quickshell/modules/bar/Workspaces.qml — Neovim' : 'Claude Design — Mozilla Firefox'),
      titleMax: busy ? 300 : 420, clock: p.clock ?? 'Thu 01 Oct 21:07' };
  }
}
</script>
</body>
</html>
